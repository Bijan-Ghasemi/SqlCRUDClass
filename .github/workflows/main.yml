# create file in repository => .github\workflows\main.yml
# Create variables in repository

name: Build, Test & Publish (All Secrets)

on:
  push:
    tags:
      - 'v*'  # فقط وقتی تگ‌هایی مثل v1.0.0 push شوند

jobs:
  build:
    permissions:
      contents: write
      packages: write
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: windows-latest

    env:
      DOTNET_VERSION: 8.0.x
      RUN_TESTS: 'false'
      GIT_RELEASE_ENABLED: 'true'

      GIT_PACKAGE_ENABLED: 'true'
      GIT_PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      NUGET_PACKAGE_ENABLED: 'true'
      NUGET_PACKAGE_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      # Build your artifacts/my-sdk.nupkg package here

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        if: ${{ env.NUGET_PACKAGE_ENABLED == 'true' }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # --- 1. Checkout Code ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 2. Setup .NET SDK ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # --- 3. Restore Dependencies ---
      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      # --- 4. Build in Release mode ---
      - name: Build project
        working-directory: src
        run: dotnet build --configuration Release --no-restore

      # --- 5. Run Tests (Optional) ---
      - name: Run tests
        if: ${{ env.RUN_TESTS == 'true' }}
        working-directory: test
        run: dotnet test --configuration Release

      # --- 6. Pack NuGet Package (PowerShell compatible) ---
      - name: Pack NuGet package
        working-directory: src
        shell: pwsh
        run: |
          # استخراج نسخه از Git Tag (v1.0.0 -> 1.0.0)
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host "📦 Package Version: $version"

          # Pack با نسخه و RepositoryUrl
          dotnet pack --configuration Release `
            -p:PackageVersion=$version `
            -p:RepositoryUrl="https://github.com/$env:GITHUB_REPOSITORY" `
            -o ../nuget

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet pack failed."
          }

          # بررسی اینکه فایل بسته تولید شده باشد
          if (-not (Get-ChildItem -Path "../nuget" -Filter "*.nupkg" -File)) {
            throw "No NuGet package was generated."
          }

      # --- 7. Publish to GitHub Packages ---
      - name: Publish to GitHub Packages
        if: ${{ env.GIT_PACKAGE_ENABLED == 'true' }}
        working-directory: nuget
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "📦 Publishing to GitHub Packages..."
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Package source: $env:GIT_PACKAGE_SOURCE"

          # Use GITHUB_TOKEN with the packages: write permission
          dotnet nuget push "*.nupkg" `
            --source "$env:GIT_PACKAGE_SOURCE" `
            --api-key "$env:GH_TOKEN" `
            --skip-duplicate

          if ($LASTEXITCODE -ne 0) {
            throw "Publishing to GitHub Packages failed."
          }

      # --- 8. Publish to NuGet.org ---
      - name: Publish to NuGet.org
        if: ${{ env.NUGET_PACKAGE_ENABLED == 'true' }}
        working-directory: nuget
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Write-Host "📦 Publishing to NuGet.org..."

          # Ensure the temporary API key was provided by the OIDC login step
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NuGet.org API key was not provided by NuGet/login."
          }

          dotnet nuget push "*.nupkg" `
            --source "$env:NUGET_PACKAGE_SOURCE" `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate

          if ($LASTEXITCODE -ne 0) {
            throw "Publishing to NuGet.org failed."
          }

      # --- 9. Create ZIP for GitHub Release ---
      - name: Create ZIP of publish folder
        shell: pwsh
        run: |
          # Create the publish folder
          New-Item -ItemType Directory -Force -Path "publish" | Out-Null

          # Find files in Release output directories
          $files = Get-ChildItem -Path "src" -File -Recurse |
            Where-Object {
              $_.FullName -match '[\\/]bin[\\/]Release[\\/]' -and
              $_.FullName -notmatch '[\\/]ref[\\/]' 
            }

          if (-not $files) {
            throw "No Release output files were found to include in the ZIP."
          }

          # Create ZIP from the Release output files
          Compress-Archive `
            -Path $files.FullName `
            -DestinationPath "publish/release.zip" `
            -Force

      # --- 10. Create GitHub Release ---
      - name: Create GitHub Release
        if: ${{ env.GIT_RELEASE_ENABLED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/release.zip
            nuget/*.nupkg
          generate_release_notes: true
